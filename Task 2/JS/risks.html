<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
/* ===== TABLE ===== */
#risks_table_container {
  font-family: Arial, sans-serif;
  background: #f6f7f9;
}

.risks_table_wrapper {
  background:#fff;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  overflow-x:auto;
}

table.risks_table {
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

th, td {
  padding:12px 14px;
  border:1px solid #ddd;
  font-size:14px;
  text-align:center;
}

th {
  background:#f1f3f5;
  color:#003366;
  cursor:pointer;
}

td.description {
  text-align:left;
}

.risks_table_badge {
  padding:4px 8px;
  border-radius:4px;
  color:#fff;
  font-size:12px;
}

.risks_table_high { background:#d93025; }
.risks_table_medium { background:#f9ab00; }
.risks_table_low { background:#188038; }

.risks_table_edit-link {
  color:#1a73e8;
  cursor:pointer;
}
/* ===== MODAL FIX ===== */
#editModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  font-family:Arial,sans-serif;
}

#editModal_content {
  background:#f6f6f6;
  width:760px;
  max-width:92%;
  border-radius:10px;
  margin:5% auto;
  box-shadow:0 12px 32px rgba(0,0,0,.18);
  overflow:hidden;
}

/* HEADER */
#editModal_header {
  padding:22px 24px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
}

#editModal_header h3 {
  margin:0;
  font-size:20px;
  color:#1f2a44;
  font-weight:600;
}

#editModal_closeX {
  background:transparent;
  border:none;
  border-radius:6px;
  width:36px;
  height:36px;
  font-size:22px;
  line-height:1;
  color:#1f2937;
  cursor:pointer;
}

/* BODY */
#editModal_body {
  padding:24px;
  display:grid;
  grid-template-columns:1fr;
  row-gap:16px;
  background:#f6f6f6;
}

.editModal_field label {
  display:block;
  margin-bottom:6px;
  font-size:13px;
  color:#6b7280;
}

#editModal_body input,
#editModal_body textarea,
#editModal_body select {
  width:100%;
  height:44px;
  padding:9px 12px;
  font-size:14px;
  color:#111827;
  border:1px solid #cbd5e1;
  border-radius:6px;
  box-sizing:border-box;
  background:#fff;
}

#editModal_body textarea {
  height:96px;
  resize:vertical;
}

.custom-select {
  position:relative;
}

.custom-select__toggle {
  width:100%;
  height:44px;
  padding:9px 36px 9px 12px;
  font-size:14px;
  color:#111827;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:6px;
  text-align:left;
  cursor:pointer;
  position:relative;
}

.custom-select__toggle::after {
  content:"";
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-45%);
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:6px solid #6b7280;
}

.custom-select__list {
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 6px);
  z-index:20;
  margin:0;
  padding:6px 0;
  list-style:none;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:6px;
  box-shadow:0 8px 20px rgba(15,23,42,.12);
  max-height:216px;
  overflow-y:auto;
}

.custom-select__option {
  padding:8px 12px;
  font-size:14px;
  line-height:20px;
  cursor:pointer;
}

.custom-select__option:hover {
  background:#f1f5f9;
}

.custom-select__option.is-selected {
  background:#1a73e8;
  color:#fff;
}

.custom-select__native {
  display:none;
}

.custom-select.is-open .custom-select__list {
  display:block;
}

.custom-select.is-open .custom-select__toggle {
  border-color:#4a7cff;
  box-shadow:0 0 0 3px rgba(74,124,255,.15);
}

.custom-select.is-open .custom-select__toggle::after {
  transform:translateY(-55%) rotate(180deg);
}

/* READONLY IMPACT */
#modalImpact {
  font-weight:600;
  cursor:default;
  background:#f3f4f6;
}

/* impact colors */
#modalImpact.impact-high {
  background:#d93025;
  color:#fff;
  border-color:#d93025;
}

#modalImpact.impact-medium {
  background:#f9ab00;
  color:#fff;
  border-color:#f9ab00;
}

#modalImpact.impact-low {
  background:#188038;
  color:#fff;
  border-color:#188038;
}

/* FOOTER */
#editModal_footer {
  padding:20px 24px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:#fff;
}

#editModal_footer button {
  min-width:120px;
  height:42px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
  border:1px solid transparent;
}

/* buttons */
#deleteModal {
  background:#dc3545;
  color:#fff;
}

#saveModal {
  background:#4a7cff;
  color:#fff;
}

#closeModal {
  background:#fff;
  color:#4a7cff;
  border:1px solid #4a7cff;
}

.editModal_actions {
  display:flex;
  gap:12px;
  margin-left:auto;
}


/* ===== HISTORY ===== */
#risks_history_container {
  margin-top:30px;
  font-family:Arial,sans-serif;
}

.history-date {
  background:#f1f3f5;
  padding:12px 16px;
  border-radius:6px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.history-risks {
  display:none;
  margin:10px 0 20px 20px;
}

.history-risk {
  background:#f1f3f5;
  padding:10px 12px;
  margin-bottom:8px;
  border-left:4px solid transparent;
  border-radius:4px;
  font-size:13px;
}

.history-risk.high { border-left-color:#d93025; }
.history-risk.medium { border-left-color:#f9ab00; }
.history-risk.low { border-left-color:#188038; }
</style>
</head>

<body>

<!-- ===== MODAL ===== -->
<div id="editModal">
  <div id="editModal_content">
    <div id="editModal_header">
      <h3>Редактировать риск</h3>
      <button id="editModal_closeX">×</button>
    </div>

    <div id="editModal_body">
      <div class="editModal_field">
        <label for="modalCategory">Категория риска *</label>
        <input id="modalCategory" type="text">
      </div>

      <div class="editModal_field">
        <label for="modalDescription">Описание риска *</label>
        <textarea id="modalDescription"></textarea>
      </div>

      <div class="editModal_field">
        <label for="modalProbabilityToggle">Вероятность *</label>
        <div class="custom-select" id="modalProbabilitySelect">
          <button type="button" id="modalProbabilityToggle" class="custom-select__toggle" aria-haspopup="listbox" aria-expanded="false">-</button>
          <ul class="custom-select__list" role="listbox" aria-labelledby="modalProbabilityToggle">
            <li class="custom-select__option is-selected" data-value="">-</li>
            <li class="custom-select__option" data-value="H1">Н1</li>
            <li class="custom-select__option" data-value="H2">Н2</li>
            <li class="custom-select__option" data-value="H3">Н3</li>
            <li class="custom-select__option" data-value="H4">Н4</li>
            <li class="custom-select__option" data-value="C5">С5</li>
            <li class="custom-select__option" data-value="C6">С6</li>
            <li class="custom-select__option" data-value="C7">С7</li>
            <li class="custom-select__option" data-value="C8">С8</li>
            <li class="custom-select__option" data-value="C9">С9</li>
            <li class="custom-select__option" data-value="C10">С10</li>
            <li class="custom-select__option" data-value="C11">С11</li>
            <li class="custom-select__option" data-value="C12">С12</li>
            <li class="custom-select__option" data-value="B15">B15</li>
            <li class="custom-select__option" data-value="B16">B16</li>
            <li class="custom-select__option" data-value="B17">B17</li>
            <li class="custom-select__option" data-value="B18">B18</li>
            <li class="custom-select__option" data-value="B19">B19</li>
            <li class="custom-select__option" data-value="B20">B20</li>
            <li class="custom-select__option" data-value="B21">B21</li>
            <li class="custom-select__option" data-value="B22">B22</li>
            <li class="custom-select__option" data-value="B23">B23</li>
            <li class="custom-select__option" data-value="B24">B24</li>
            <li class="custom-select__option" data-value="B25">B25</li>
          </ul>
        </div>
        <select id="modalProbability" class="custom-select__native">
          <option value="">-</option>
          <option value="H1">Н1</option>
          <option value="H2">Н2</option>
          <option value="H3">Н3</option>
          <option value="H4">Н4</option>
          <option value="C5">С5</option>
          <option value="C6">С6</option>
          <option value="C7">С7</option>
          <option value="C8">С8</option>
          <option value="C9">С9</option>
          <option value="C10">С10</option>
          <option value="C11">С11</option>
          <option value="C12">С12</option>
          <option value="B15">B15</option>
          <option value="B16">B16</option>
          <option value="B17">B17</option>
          <option value="B18">B18</option>
          <option value="B19">B19</option>
          <option value="B20">B20</option>
          <option value="B21">B21</option>
          <option value="B22">B22</option>
          <option value="B23">B23</option>
          <option value="B24">B24</option>
          <option value="B25">B25</option>
        </select>
      </div>

      <div class="editModal_field">
        <label for="modalAssessment">Оценка риска *</label>
        <select id="modalAssessment">
          <option value="">-</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <div class="editModal_field">
        <label for="modalImpact">Влияние</label>
        <input id="modalImpact" readonly>
      </div>
    </div>

    <div id="editModal_footer">
      <button id="deleteModal">Удалить</button>
      <div class="editModal_actions">
        <button id="saveModal">Изменить</button>
        <button id="closeModal">Отмена</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== TABLE ===== -->
<div id="risks_table_container">
  <div class="risks_table_wrapper">
    <table class="risks_table">
      <thead>
        <tr>
          <th>№</th>
          <th>Категория</th>
          <th>Описание</th>
          <th>Влияние</th>
          <th>Вероятность</th>
          <th>Оценка</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="risks_table_body"></tbody>
    </table>
  </div>
</div>

<!-- ===== HISTORY ===== -->
<div id="risks_history_container">
  <div id="risks_history_list"></div>
</div>

<script type="module">
$(document).ready(function(){

let currentData = [];
let currentEditIndex = null;

/* ===== IMPACT ===== */
function calcImpact(p,a){
  if(!p||!a) return '';
  if(p[0]==='H') return a<3?'Приемлемое':'Допустимое';
  if(p[0]==='C') return a==1?'Приемлемое':a==2?'Допустимое':'Недопустимое';
  if(p[0]==='B') return a==1?'Допустимое':'Недопустимое';
}

function setImpactField(value){
  const field = $('#modalImpact');
  field
    .val(value)
    .removeClass('impact-high impact-medium impact-low');

  if(value === 'Недопустимое'){
    field.addClass('impact-high');
    return;
  }
  if(value === 'Допустимое'){
    field.addClass('impact-medium');
    return;
  }
  if(value === 'Приемлемое'){
    field.addClass('impact-low');
  }
}

function setProbabilitySelect(value){
  const $root = $('#modalProbabilitySelect');
  const $native = $('#modalProbability');
  const $toggle = $('#modalProbabilityToggle');
  const $options = $root.find('.custom-select__option');

  $native.val(value);
  $options.removeClass('is-selected');
  const $selected = $options.filter(`[data-value="${value}"]`);
  const label = $selected.length ? $selected.text() : '-';
  $selected.addClass('is-selected');
  $toggle.text(label);
}

function closeProbabilitySelect(){
  const $root = $('#modalProbabilitySelect');
  if($root.hasClass('is-open')){
    $root.removeClass('is-open');
    $('#modalProbabilityToggle').attr('aria-expanded','false');
  }
}

function openProbabilitySelect(){
  const $root = $('#modalProbabilitySelect');
  if(!$root.hasClass('is-open')){
    $root.addClass('is-open');
    $('#modalProbabilityToggle').attr('aria-expanded','true');
  }
}

/* ===== TABLE ===== */
function impactClass(v){
  if(v==='Недопустимое')return 'risks_table_high';
  if(v==='Допустимое')return 'risks_table_medium';
  return 'risks_table_low';
}

function renderTable(){
  const tb=$('#risks_table_body').empty();
  currentData.forEach((r,i)=>{
    tb.append(`
      <tr>
        <td>${r.number}</td>
        <td>${r.category}</td>
        <td class="description">${r.description}</td>
        <td><span class="risks_table_badge ${impactClass(r.impact)}">${r.impact}</span></td>
        <td>${r.probability}</td>
        <td>${r.assessment}</td>
        <td><a class="risks_table_edit-link" data-index="${i}">Редактировать</a></td>
      </tr>
    `);
  });
}

/* ===== HISTORY ===== */
function renderHistory(){
  const map={};
  currentData.forEach(r=>{
    const d=r.date.split('T')[0];
    map[d]=map[d]||[];
    map[d].push(r);
  });

  const c=$('#risks_history_list').empty();
  Object.keys(map).forEach((d,i)=>{
    c.append(`
      <div class="history-date" data-target="h${i}">
        <div>${d}</div>
        <div>${map[d].length} рисков добавлено</div>
      </div>
      <div class="history-risks" id="h${i}">
        ${map[d].map(r=>{
          let cls=r.impact==='Недопустимое'?'high':r.impact==='Допустимое'?'medium':'low';
          return `
            <div class="history-risk ${cls}">
              <b>${r.category}</b><br>
              ${r.description}<br>
              Вероятность: ${r.probability},
              Оценка: ${r.assessment},
              Влияние: ${r.impact}
            </div>`;
        }).join('')}
      </div>
    `);
  });
}

$('#risks_history_container').on('click','.history-date',function(){
  $('#'+$(this).data('target')).slideToggle();
});

/* ===== EDIT ===== */
$('#risks_table_body').on('click','.risks_table_edit-link',function(){
  currentEditIndex=$(this).data('index');
  const r=currentData[currentEditIndex];
  $('#modalCategory').val(r.category);
  $('#modalDescription').val(r.description);
  setProbabilitySelect(r.probability || '');
  $('#modalAssessment').val(r.assessment);
  setImpactField(r.impact);
  $('#editModal').show();
});

$('#modalProbability,#modalAssessment').on('change',function(){
  const impact=calcImpact($('#modalProbability').val(),$('#modalAssessment').val());
  setImpactField(impact);
});

setProbabilitySelect($('#modalProbability').val());

$('#modalProbabilityToggle').on('click',function(e){
  e.stopPropagation();
  if($('#modalProbabilitySelect').hasClass('is-open')){
    closeProbabilitySelect();
    return;
  }
  $('.custom-select').removeClass('is-open');
  $('.custom-select__toggle').attr('aria-expanded','false');
  openProbabilitySelect();
});

$('#modalProbabilitySelect').on('click','.custom-select__option',function(e){
  e.stopPropagation();
  const value = $(this).data('value');
  setProbabilitySelect(value);
  $('#modalProbability').trigger('change');
  closeProbabilitySelect();
});

$(document).on('click',function(){
  closeProbabilitySelect();
});

$(document).on('keydown',function(e){
  if(e.key === 'Escape'){
    closeProbabilitySelect();
  }
});

$('#saveModal').on('click',function(){
  if(currentEditIndex === null){
    return;
  }
  const r=currentData[currentEditIndex];
  const probability=$('#modalProbability').val();
  const assessment=$('#modalAssessment').val();
  const impact=calcImpact(probability,assessment);

  r.category=$('#modalCategory').val();
  r.description=$('#modalDescription').val();
  r.probability=probability;
  r.assessment=assessment;
  r.impact=impact;

  setImpactField(impact);
  renderTable();
  renderHistory();
  $('#editModal').hide();
});

$('#deleteModal').on('click',function(){
  currentData.splice(currentEditIndex,1);
  renderTable();
  renderHistory();
  $('#editModal').hide();
});

$('#closeModal,#editModal_closeX').on('click',()=>{
  closeProbabilitySelect();
  $('#editModal').hide();
});

/* ===== LOAD ===== */
$.ajax({
  url:"custom_web_template.html?object_id=7597342040409919335",
  data:"project_id="+WTLP.sObjectId,
  success:r=>{
    currentData=JSON.parse(r||'[]');
    renderTable();
    renderHistory();
  }
});

});
</script>

</body>
</html>
