<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
/* ===== TABLE ===== */
#risks_table_container {
  font-family: Arial, sans-serif;
  background: #f6f7f9;
}

.risks_table_wrapper {
  background:#fff;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  overflow-x:auto;
}

table.risks_table {
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

th, td {
  padding:12px 14px;
  border:1px solid #ddd;
  font-size:14px;
  text-align:center;
}

th {
  background:#f1f3f5;
  color:#003366;
  cursor:pointer;
}

td.description {
  text-align:left;
}

.risks_table_badge {
  padding:4px 8px;
  border-radius:4px;
  color:#fff;
  font-size:12px;
}

.risks_table_high { background:#d93025; }
.risks_table_medium { background:#f9ab00; }
.risks_table_low { background:#188038; }

.risks_table_edit-link {
  color:#1a73e8;
  cursor:pointer;
}
/* ===== MODAL FIX ===== */
#editModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  font-family:Arial,sans-serif;
}

#editModal_content {
  background:#fff;
  width:600px;
  max-width:90%;
  border-radius:8px;
  margin:6% auto;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  overflow:hidden;
}

/* HEADER */
#editModal_header {
  padding:16px 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#editModal_header h3 {
  margin:0;
  font-size:18px;
  color:#003366;
}

#editModal_closeX {
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:4px;
  width:32px;
  height:32px;
  font-size:18px;
  cursor:pointer;
}

/* BODY */
#editModal_body {
  padding:20px;
  display:grid;
  grid-template-columns:1fr;
  row-gap:14px;
}

#editModal_body input,
#editModal_body textarea,
#editModal_body select {
  width:100%;
  height:40px;
  padding:8px 10px;
  font-size:14px;
  border:1px solid #d1d5db;
  border-radius:4px;
  box-sizing:border-box;
}

#editModal_body textarea {
  height:90px;
  resize:vertical;
}

/* READONLY IMPACT */
#modalImpact {
  font-weight:600;
  cursor:default;
}

/* impact colors */
#modalImpact.impact-high {
  background:#d93025;
  color:#fff;
  border-color:#d93025;
}

#modalImpact.impact-medium {
  background:#f9ab00;
  color:#fff;
  border-color:#f9ab00;
}

#modalImpact.impact-low {
  background:#188038;
  color:#fff;
  border-color:#188038;
}

/* FOOTER */
#editModal_footer {
  padding:16px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#editModal_footer button {
  min-width:110px;
  height:40px;
  border-radius:4px;
  font-size:14px;
  cursor:pointer;
  border:none;
}

/* buttons */
#deleteModal {
  background:#dc3545;
  color:#fff;
}

#saveModal {
  background:#4a7cff;
  color:#fff;
}

#closeModal {
  background:#f1f3f5;
  color:#333;
}


/* ===== HISTORY ===== */
#risks_history_container {
  margin-top:30px;
  font-family:Arial,sans-serif;
}

.history-date {
  background:#f1f3f5;
  padding:12px 16px;
  border-radius:6px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.history-risks {
  display:none;
  margin:10px 0 20px 20px;
}

.history-risk {
  background:#f1f3f5;
  padding:10px 12px;
  margin-bottom:8px;
  border-left:4px solid transparent;
  border-radius:4px;
  font-size:13px;
}

.history-risk.high { border-left-color:#d93025; }
.history-risk.medium { border-left-color:#f9ab00; }
.history-risk.low { border-left-color:#188038; }
</style>
</head>

<body>

<!-- ===== MODAL ===== -->
<div id="editModal">
  <div id="editModal_content">
    <div id="editModal_header">
      <h3>Редактировать риск</h3>
      <button id="editModal_closeX">×</button>
    </div>

    <div id="editModal_body">
      <input id="modalCategory" placeholder="Категория">
      <textarea id="modalDescription" placeholder="Описание"></textarea>

      <select id="modalProbability">
        <option value="">Вероятность</option>
        <option>H1</option><option>H2</option><option>H3</option>
        <option>C5</option><option>C6</option>
        <option>B15</option><option>B16</option>
      </select>

      <select id="modalAssessment">
        <option value="">Оценка</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>

      <input id="modalImpact" readonly>
    </div>

    <div id="editModal_footer">
      <button id="deleteModal">Удалить</button>
      <button id="saveModal">Изменить</button>
      <button id="closeModal">Отмена</button>
    </div>
  </div>
</div>

<!-- ===== TABLE ===== -->
<div id="risks_table_container">
  <div class="risks_table_wrapper">
    <table class="risks_table">
      <thead>
        <tr>
          <th>№</th>
          <th>Категория</th>
          <th>Описание</th>
          <th>Влияние</th>
          <th>Вероятность</th>
          <th>Оценка</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="risks_table_body"></tbody>
    </table>
  </div>
</div>

<!-- ===== HISTORY ===== -->
<div id="risks_history_container">
  <div id="risks_history_list"></div>
</div>

<script type="module">
$(document).ready(function(){

let currentData = [];
let currentEditIndex = null;

/* ===== IMPACT ===== */
function calcImpact(p,a){
  if(!p||!a) return '';
  if(p[0]==='H') return a<3?'Приемлемое':'Допустимое';
  if(p[0]==='C') return a==1?'Приемлемое':a==2?'Допустимое':'Недопустимое';
  if(p[0]==='B') return a==1?'Допустимое':'Недопустимое';
}

function setImpactField(value){
  const field = $('#modalImpact');
  field
    .val(value)
    .removeClass('impact-high impact-medium impact-low');

  if(value === 'Недопустимое'){
    field.addClass('impact-high');
    return;
  }
  if(value === 'Допустимое'){
    field.addClass('impact-medium');
    return;
  }
  if(value === 'Приемлемое'){
    field.addClass('impact-low');
  }
}

/* ===== TABLE ===== */
function impactClass(v){
  if(v==='Недопустимое')return 'risks_table_high';
  if(v==='Допустимое')return 'risks_table_medium';
  return 'risks_table_low';
}

function renderTable(){
  const tb=$('#risks_table_body').empty();
  currentData.forEach((r,i)=>{
    tb.append(`
      <tr>
        <td>${r.number}</td>
        <td>${r.category}</td>
        <td class="description">${r.description}</td>
        <td><span class="risks_table_badge ${impactClass(r.impact)}">${r.impact}</span></td>
        <td>${r.probability}</td>
        <td>${r.assessment}</td>
        <td><a class="risks_table_edit-link" data-index="${i}">Редактировать</a></td>
      </tr>
    `);
  });
}

/* ===== HISTORY ===== */
function renderHistory(){
  const map={};
  currentData.forEach(r=>{
    const d=r.date.split('T')[0];
    map[d]=map[d]||[];
    map[d].push(r);
  });

  const c=$('#risks_history_list').empty();
  Object.keys(map).forEach((d,i)=>{
    c.append(`
      <div class="history-date" data-target="h${i}">
        <div>${d}</div>
        <div>${map[d].length} рисков добавлено</div>
      </div>
      <div class="history-risks" id="h${i}">
        ${map[d].map(r=>{
          let cls=r.impact==='Недопустимое'?'high':r.impact==='Допустимое'?'medium':'low';
          return `
            <div class="history-risk ${cls}">
              <b>${r.category}</b><br>
              ${r.description}<br>
              Вероятность: ${r.probability},
              Оценка: ${r.assessment},
              Влияние: ${r.impact}
            </div>`;
        }).join('')}
      </div>
    `);
  });
}

$('#risks_history_container').on('click','.history-date',function(){
  $('#'+$(this).data('target')).slideToggle();
});

/* ===== EDIT ===== */
$('#risks_table_body').on('click','.risks_table_edit-link',function(){
  currentEditIndex=$(this).data('index');
  const r=currentData[currentEditIndex];
  $('#modalCategory').val(r.category);
  $('#modalDescription').val(r.description);
  $('#modalProbability').val(r.probability);
  $('#modalAssessment').val(r.assessment);
  setImpactField(r.impact);
  $('#editModal').show();
});

$('#modalProbability,#modalAssessment').on('change',function(){
  const impact=calcImpact($('#modalProbability').val(),$('#modalAssessment').val());
  setImpactField(impact);
});

$('#saveModal').on('click',function(){
  if(currentEditIndex === null){
    return;
  }
  const r=currentData[currentEditIndex];
  const probability=$('#modalProbability').val();
  const assessment=$('#modalAssessment').val();
  const impact=calcImpact(probability,assessment);

  r.category=$('#modalCategory').val();
  r.description=$('#modalDescription').val();
  r.probability=probability;
  r.assessment=assessment;
  r.impact=impact;

  setImpactField(impact);
  renderTable();
  renderHistory();
  $('#editModal').hide();
});

$('#deleteModal').on('click',function(){
  currentData.splice(currentEditIndex,1);
  renderTable();
  renderHistory();
  $('#editModal').hide();
});

$('#closeModal,#editModal_closeX').on('click',()=>$('#editModal').hide());

/* ===== LOAD ===== */
$.ajax({
  url:"custom_web_template.html?object_id=7597342040409919335",
  data:"project_id="+WTLP.sObjectId,
  success:r=>{
    currentData=JSON.parse(r||'[]');
    renderTable();
    renderHistory();
  }
});

});
</script>

</body>
</html>
