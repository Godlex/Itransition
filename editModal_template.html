<!-- Modal HTML Template -->
<!-- Copy this into your application where you need the modal -->

<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000;">
  <div id="editModal_content">
    <div id="editModal_header">
      <h3>Добавить данные</h3>
      <button type="button" id="editModal_closeX">&times;</button>
    </div>
    
    <div id="editModal_body">
      <div>
        <label>Категория риска <span class="editModal_required">*</span></label>
        <input type="text" id="modalCategory">
      </div>

      <div>
        <label>Описание риска <span class="editModal_required">*</span></label>
        <textarea id="modalDescription" rows="3"></textarea>
      </div>

      <div>
        <label>Вероятность <span class="editModal_required">*</span></label>
        <select id="modalProbability">
          <option value="">-</option>
          <option value="H1">H1</option>
          <option value="H2">H2</option>
          <option value="H3">H3</option>
          <option value="H4">H4</option>
          <option value="C5">C5</option>
          <option value="C6">C6</option>
          <option value="C7">C7</option>
          <option value="C8">C8</option>
          <option value="C9">C9</option>
          <option value="C10">C10</option>
          <option value="C11">C11</option>
          <option value="C12">C12</option>
          <option value="B15">B15</option>
          <option value="B17">B17</option>
          <option value="B18">B18</option>
          <option value="B19">B19</option>
          <option value="B20">B20</option>
          <option value="B21">B21</option>
        </select>
      </div>

      <div>
        <label>Оценка риска <span class="editModal_required">*</span></label>
        <select id="modalAssessment">
          <option value="">-</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
    </div>

    <div id="editModal_footer">
      <button type="button" id="saveModal">Добавить</button>
      <button type="button" id="closeModal">Отмена</button>
    </div>
  </div>
</div>

<!-- JavaScript for modal (uses only standard jQuery, no jQuery UI) -->
<script>
$(document).ready(function() {
  // Close modal function
  function closeEditModal() {
    $('#editModal').hide();
  }

  // Open modal function (call this when you need to show the modal)
  window.openEditModal = function(data) {
    if (data) {
      $('#modalCategory').val(data.category || '');
      $('#modalDescription').val(data.description || '');
      $('#modalProbability').val(data.probability || '');
      $('#modalAssessment').val(data.assessment || '');
    }
    $('#editModal').show();
  };

  // Close button handlers
  $('#closeModal, #editModal_closeX').on('click', closeEditModal);

  // Close on overlay click
  $('#editModal').on('click', function(e) {
    if (e.target === this) {
      closeEditModal();
    }
  });

  // Close on Escape key
  $(document).on('keydown', function(e) {
    if (e.key === 'Escape' && $('#editModal').is(':visible')) {
      closeEditModal();
    }
  });

  // Save handler (customize as needed)
  $('#saveModal').on('click', function() {
    var formData = {
      category: $('#modalCategory').val(),
      description: $('#modalDescription').val(),
      probability: $('#modalProbability').val(),
      assessment: $('#modalAssessment').val()
    };
    
    // TODO: Add your save logic here
    console.log('Save data:', formData);
    
    closeEditModal();
  });
});
</script>
